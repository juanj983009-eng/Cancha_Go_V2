<section>

  <div class="catalogue-filters">

    <div class="catalogue-filters__search">

      <label for="busqueda" class="form-label">
        Buscar cancha
      </label>

      <input
        id="busqueda"
        type="text"
        class="form-control"
        name="busqueda"
        autocomplete="off"
        aria-describedby="busqueda-ayuda"
        [(ngModel)]="busqueda"
      >
      <span id="busqueda-ayuda" class="form-help">Busca por el nombre de la cancha.</span>

    </div>

    <div class="catalogue-filters__select">

      <label for="categoria" class="form-label">
        Categoría
      </label>

      <select
        id="categoria"
        name="categoria"
        class="form-select"
        [(ngModel)]="categoriaSeleccionada"
      >

        <option value="">
          Todas las categorías
        </option>

        @for (categoria of categorias; track categoria) {
          <option [value]="categoria">
            {{ categoria }}
          </option>
        }

      </select>

    </div>

  </div>

  @if (productosFiltrados.length > 0) {

    <div class="row g-4">

      <div
        class="col-12 col-md-6 col-xl-4"
        *ngFor="let producto of productosFiltrados"
      >

        <app-product-card
          [producto]="producto"
        />

      </div>

    </div>

  } @else {

    <div class="catalogue-empty" role="status">
      <strong>No se encontraron canchas.</strong>
      <span>Prueba con otro nombre o categoría.</span>
    </div>

  }

</section>
