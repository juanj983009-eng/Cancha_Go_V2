<nav class="navbar-cancha" aria-label="Navegación de Cancha Go">

  <div class="container navbar-container">

    <a
      class="logo"
      routerLink="/"
      (click)="cerrarMenu()"
    >
      <span class="logo-mark" aria-hidden="true">CG</span><span>Cancha Go</span>
    </a>

    <button
      class="menu-button"
      type="button"
      (click)="cambiarMenu()"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="cancha-go-menu"
      aria-label="{{ menuAbierto ? 'Cerrar menú de navegación' : 'Abrir menú de navegación' }}"
    >
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>

    <div
      class="nav-menu"
      id="cancha-go-menu"
      [class.menu-abierto]="menuAbierto"
    >

      <div class="nav-menu__public" role="group" aria-label="Navegación pública">
      <a
        routerLink="/"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()"
      >
        Inicio
      </a>

      <a
        routerLink="/productos"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        (click)="cerrarMenu()"
      >
        Canchas
      </a>

      <a
        routerLink="/ofertas"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        (click)="cerrarMenu()"
      >
        Ofertas
      </a>

      <a
        routerLink="/tienda"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        (click)="cerrarMenu()"
      >
        Tienda
      </a>

      <a
        routerLink="/contacto"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        (click)="cerrarMenu()"
      >
        Contacto
      </a>
      </div>

      <div class="nav-menu__account" role="group" aria-label="Área de usuario">
      <span class="nav-menu__label">Tu espacio</span>
      <a
        routerLink="/mi-cuenta"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        (click)="cerrarMenu()"
      >
        Mi cuenta
      </a>

      @if (autenticado) {
        <a routerLink="/dashboard" routerLinkActive="activo" ariaCurrentWhenActive="page" (click)="cerrarMenu()">Mi panel</a>
        <a routerLink="/mis-reservas" routerLinkActive="activo" ariaCurrentWhenActive="page" (click)="cerrarMenu()">Mis reservas</a>
        <button type="button" class="nav-action" (click)="cerrarSesion()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" routerLinkActive="activo" ariaCurrentWhenActive="page" (click)="cerrarMenu()">Iniciar sesión</a>
      }
      </div>

    </div>

  </div>

</nav>
