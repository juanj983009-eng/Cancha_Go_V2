<section class="container cg-page-section">

  <header class="cg-page-intro">
    <span class="cg-eyebrow">Catálogo deportivo</span>
    <h1>Encuentra tu cancha</h1>
    <p>Explora espacios, compara disponibilidad y reserva tu próximo partido.</p>
  </header>

  @if (cargando()) {
    <div class="alert alert-info" role="status" aria-live="polite">Cargando canchas…</div>
  } @else if (error()) {
    <div class="alert alert-danger" role="alert" aria-live="polite">{{ error() }}</div>
  } @else {
    <app-product-list [productos]="productos()" />
  }

</section>
