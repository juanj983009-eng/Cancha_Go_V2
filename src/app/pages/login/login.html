<section class="container cg-page-section">

  <div class="row justify-content-center">

    <div class="col-12 col-md-7 col-lg-5">

      <div class="login-card">

        <div class="text-center mb-4">

          <span class="cg-eyebrow">
            CANCHA GO
          </span>

          <h1 class="login-title">
            Iniciar sesión
          </h1>

          <p class="login-lead">
            Accede a tu cuenta para gestionar tus reservas.
          </p>

        </div>

        <form (ngSubmit)="iniciarSesion()">

          <div class="mb-3">

            <label
              for="correo"
              class="form-label"
            >
              Correo electrónico
            </label>

            <input
              id="correo"
              name="correo"
              type="email"
              class="form-control"
              [(ngModel)]="correo"
              placeholder="admin@canchago.com"
              required
            >

          </div>

          <div class="mb-3">

            <label
              for="password"
              class="form-label"
            >
              Contraseña
            </label>

            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              [(ngModel)]="password"
              placeholder="••••••"
              required
            >

          </div>

          @if (error) {

            <div class="alert alert-danger" role="alert" aria-live="polite">
              {{ error }}
            </div>

          }

          <button
            type="submit"
            class="btn btn-success w-100"
          >
            Iniciar sesión
          </button>

        </form>

        <div class="demo-account mt-4">

          <small>
            Cuenta de demostración
          </small>

          <div>
            admin@canchago.com
          </div>

          <div>
            Contraseña: 123456
          </div>

        </div>

      </div>

    </div>

  </div>

</section>
