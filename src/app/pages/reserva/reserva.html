<section class="container py-5">

  <div class="row justify-content-center">

    <div class="col-12 col-lg-8">

      <div class="reservation-card">

        <span class="text-success fw-semibold">
          RESERVA
        </span>

        @if (producto()) {

          <h1 class="fw-bold mt-2">
            {{ producto()!.nombre }}
          </h1>

          <p class="text-secondary">
            Categoría: {{ producto()!.categoria }}
          </p>

          <div class="price">
            S/ {{ producto()!.precio | number:'1.2-2' }}
          </div>

          <form
            class="mt-4"
            (ngSubmit)="confirmarReserva()"
          >

            <div class="mb-3">

              <label
                for="fecha"
                class="form-label"
              >
                Fecha
              </label>

              <input
                id="fecha"
                name="fecha"
                type="date"
                class="form-control"
                [(ngModel)]="fecha"
                [min]="fechaMinima"
                required
              >

            </div>

            <div class="mb-3">

              <label
                for="hora"
                class="form-label"
              >
                Hora
              </label>

              <input
                id="hora"
                name="hora"
                type="time"
                class="form-control"
                [(ngModel)]="hora"
                required
              >

            </div>

            @if (error()) {

              <div class="alert alert-danger">
                {{ error() }}
              </div>

            }

            <button
              type="submit"
              class="btn btn-success"
            >
              Confirmar reserva
            </button>

          </form>

        } @else if (error()) {

          <div class="alert alert-danger">
            {{ error() }}
          </div>

        } @else {

          <p>
            Cargando cancha...
          </p>

        }

      </div>

    </div>

  </div>

</section>
