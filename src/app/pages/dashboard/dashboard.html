<section class="container cg-page-section">

  <div class="dashboard-header">

    <div>

      <span class="cg-eyebrow">
        PANEL DE CONTROL
      </span>

      <h1>
        Bienvenido, {{ usuario?.nombre }}
      </h1>

      <p>
        {{ usuario?.correo }}
      </p>

    </div>

    <button
      class="btn btn-outline-danger"
      (click)="cerrarSesion()"
    >
      Cerrar sesión
    </button>

  </div>

  <section class="dashboard-summary" aria-label="Resumen de tu actividad">
  <div class="row g-4 mt-3">

    <div class="col-12 col-md-4">

      <div class="dashboard-card dashboard-card--primary">
        <span>Reservas</span>
        <strong>{{ cantidadReservas }}</strong>
      </div>

    </div>

    <div class="col-12 col-md-4">

      <div class="dashboard-card">
        <span>Canchas disponibles</span>
        <strong>6</strong>
      </div>

    </div>

    <div class="col-12 col-md-4">

      <div class="dashboard-card">
        <span>Estado</span>
        <strong>Activo</strong>
      </div>

    </div>

  </div>
  </section>

</section>
